    <path d="M330 92a10 10 0 0 1 10-10h66a10 10 0 0 1 10 10v16h-86z" fill="#0B1220"/>
    <text x="373" y="102" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="middle">DAY ONE</text>
    <text x="373" y="152" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#155EEF" text-anchor="middle">2018</text>
    <rect x="348" y="162" width="50" height="5" rx="2.5" fill="#E4E7EC"/>

