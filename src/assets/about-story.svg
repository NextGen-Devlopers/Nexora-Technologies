    <g><rect x="134" y="262" width="72" height="42" rx="5" fill="#CBD5E1"/><circle cx="170" cy="283" r="5" fill="#22D3EE"/><rect x="190" y="266" width="12" height="12" rx="1.5" fill="#FDE68A" transform="rotate(8 196 272)"/></g>
    <g><rect x="364" y="262" width="72" height="42" rx="5" fill="#CBD5E1"/><circle cx="400" cy="283" r="5" fill="#155EEF"/><rect x="368" y="266" width="12" height="12" rx="1.5" fill="#F9A8D4" transform="rotate(-8 374 272)"/></g>

