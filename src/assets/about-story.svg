      <rect x="514" y="296" width="58" height="42" rx="4" fill="#E0B476"/><rect x="514" y="296" width="58" height="10" rx="3" fill="#C4934F"/><rect x="537" y="296" width="12" height="42" fill="#EFD2A2" opacity=".7"/>
