      <circle cx="360" cy="40" r="5"/><circle cx="440" cy="45" r="5"/><circle cx="515" cy="40" r="5"/>
    </g>
    <g fill="#FDE68A" opacity=".25"><circle cx="60" cy="48" r="11"/><circle cx="205" cy="55" r="11"/><circle cx="360" cy="40" r="11"/><circle cx="515" cy="40" r="11"/></g>

    <!-- whiteboard with first sketches -->
    <rect x="40" y="78" width="250" height="140" rx="12" fill="#F8FAFC"/>
