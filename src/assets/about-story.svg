    <rect x="460" y="112" width="12" height="38" rx="2" fill="#FDE68A"/><rect x="474" y="120" width="12" height="30" rx="2" fill="#F9A8D4"/><rect x="488" y="108" width="12" height="42" rx="2" fill="#A7F3D0"/>
    <rect x="530" y="128" width="24" height="22" rx="4" fill="#0B1220" opacity=".85"/>
