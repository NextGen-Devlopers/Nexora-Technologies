    <circle cx="226" cy="138" r="22" fill="#FDE68A"/>
    <path d="M218 158h16M221 166h10" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round"><path d="M226 104v-6M200 114l-4-4M252 114l4-4M194 138h-6M258 138h6"/></g>
    <path d="M60 192q18-14 36 0t36 0 36 0 36 0" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>

