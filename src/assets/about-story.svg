    <path d="M301 294v-34l24-14" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M316 238l20 10-12 14z" fill="#FDE68A"/>
    <g transform="rotate(-6 250 294)"><rect x="228" y="288" width="44" height="10" rx="2" fill="#FDE68A"/><rect x="228" y="288" width="6" height="10" rx="1" fill="#F59E0B"/></g>
