    <g transform="rotate(3 160 160)"><rect x="136" y="138" width="46" height="46" rx="4" fill="#FBCFE8"/><rect x="145" y="152" width="28" height="4" rx="2" fill="#9D174D" opacity=".5"/><rect x="145" y="162" width="20" height="4" rx="2" fill="#9D174D" opacity=".5"/></g>
    <g transform="rotate(-2 220 160)"><rect x="196" y="136" width="46" height="46" rx="4" fill="#A7F3D0"/><rect x="205" y="150" width="28" height="4" rx="2" fill="#047857" opacity=".5"/><rect x="205" y="160" width="20" height="4" rx="2" fill="#047857" opacity=".5"/></g>
    <g fill="#155EEF"><rect x="268" y="170" width="14" height="14" rx="3" opacity=".4"/><rect x="288" y="156" width="14" height="28" rx="3" opacity=".6"/><rect x="308" y="142" width="14" height="42" rx="3"/><rect x="328" y="160" width="14" height="24" rx="3" opacity=".7"/></g>

