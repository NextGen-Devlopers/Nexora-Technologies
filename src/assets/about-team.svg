    <g><rect x="84" y="262" width="72" height="42" rx="5" fill="#CBD5E1"/><circle cx="120" cy="283" r="5" fill="#22D3EE"/></g>
    <g><rect x="199" y="262" width="72" height="42" rx="5" fill="#CBD5E1"/><circle cx="235" cy="283" r="5" fill="#155EEF"/></g>
    <g><rect x="329" y="262" width="72" height="42" rx="5" fill="#CBD5E1"/><circle cx="365" cy="283" r="5" fill="#22D3EE"/></g>
    <g><rect x="444" y="262" width="72" height="42" rx="5" fill="#CBD5E1"/><circle cx="480" cy="283" r="5" fill="#155EEF"/></g>

