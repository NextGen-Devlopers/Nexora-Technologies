    <g fill="none" stroke="#0B1220" stroke-width="2.4" stroke-linecap="round"><path d="M113 223q7 6 14 0"/><path d="M228 223q7 6 14 0"/><path d="M358 225q7 6 14 0"/><path d="M472 223q8 6 16 0"/></g>
