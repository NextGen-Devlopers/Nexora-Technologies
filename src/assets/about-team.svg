    <path d="M454 210a26 26 0 0 1 52 0c-4-8-14-12-26-12s-22 4-26 12z" fill="#3B2A1A"/>
    <g fill="none" stroke="#0B1220" stroke-width="2.5"><circle cx="471" cy="214" r="7"/><circle cx="489" cy="214" r="7"/><path d="M478 214h4"/></g>
