    <rect x="296" y="284" width="18" height="16" rx="3" fill="#fff"/><path d="M314 288h5a4 4 0 0 1 0 8h-5" fill="none" stroke="#fff" stroke-width="2.5"/>
    <rect x="164" y="292" width="30" height="8" rx="2" fill="#FDE68A" transform="rotate(-6 179 296)"/>
