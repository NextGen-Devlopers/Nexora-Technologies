<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="A small team collaborating around a table with laptops in front of a whiteboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#155EEF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <clipPath id="card"><rect width="600" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
